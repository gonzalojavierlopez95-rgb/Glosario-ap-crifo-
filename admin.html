<title>Panel Apócrifo — Moderación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse 140% 50% at 50% 0%, rgba(232,193,92,0.06), transparent 60%),
      #0d0906;
    color:#f0e4c4;
    font-family:'EB Garamond', serif;
    padding:1.1rem 1rem 3rem;
  }
  h1{
    font-family:'Cinzel', serif; font-size:1.25rem; letter-spacing:0.04em;
    color:#f0d68a; text-align:center; margin:0.4rem 0 0.2rem;
    text-shadow:0 0 18px rgba(232,193,92,0.2);
  }
  .sub{
    text-align:center; color:#a89876; font-size:0.85rem; margin:0 0 1.4rem;
  }

  /* pantalla de clave */
  .gate{
    max-width:380px; margin:3rem auto 0;
    background:linear-gradient(180deg,#241b12,#140f09);
    border:1px solid #55431f; border-radius:14px; padding:1.5rem;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  .gate label{
    display:block; font-family:'Cinzel', serif; font-size:0.62rem; letter-spacing:0.1em;
    text-transform:uppercase; color:#8a7a5a; margin-bottom:0.5rem;
  }
  input[type=password]{
    width:100%; background:#0a0705; border:1px solid #55431f; border-radius:10px;
    padding:0.8rem 0.9rem; color:#f0e4c4; font-family:'EB Garamond', serif; font-size:1rem;
  }
  input[type=password]:focus{outline:none; border-color:#c99a3e; box-shadow:0 0 0 3px rgba(232,193,92,0.12);}
  button{
    all:unset; cursor:pointer; box-sizing:border-box; text-align:center;
    font-family:'Cinzel', serif; letter-spacing:0.05em; text-transform:uppercase;
  }
  .btn-primary{
    display:block; width:100%; margin-top:1rem; padding:0.8rem;
    background:linear-gradient(180deg,#ffe08a,#b8862f); border:1px solid #e8c15c;
    color:#1a1206; font-weight:700; font-size:0.75rem; border-radius:10px;
  }
  .gate-error{color:#e08a8a; font-size:0.8rem; text-align:center; margin-top:0.8rem; display:none;}

  /* lista de pendientes */
  #app{display:none; max-width:520px; margin:0 auto;}
  .stats-bar{
    display:flex; justify-content:center; gap:1.2rem; margin-bottom:1.2rem;
    font-family:'Cinzel', serif; font-size:0.7rem; color:#a89876; text-transform:uppercase; letter-spacing:0.05em;
  }
  .stats-bar b{color:#e8c15c; font-size:0.95rem; display:block; text-align:center;}
  .empty{
    text-align:center; color:#7a6c50; font-style:italic; padding:3rem 1rem; font-size:0.95rem;
  }
  .card{
    background:linear-gradient(180deg,#1c150d,#120d08);
    border:1px solid #4a3a1f; border-radius:14px; padding:1.1rem 1.15rem;
    margin-bottom:1rem; box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .card.dup{border-color:#6b4a1f;}
  .card-top{display:flex; justify-content:space-between; align-items:baseline; gap:0.6rem; margin-bottom:0.5rem;}
  .card-palabra{font-family:'Cinzel', serif; font-size:1.15rem; color:#f5dd96; letter-spacing:0.02em;}
  .card-fecha{font-size:0.72rem; color:#7a6c50; white-space:nowrap;}
  .card-significado{font-size:0.92rem; color:#d8c9a3; line-height:1.5; margin-bottom:0.6rem;}
  .card-meta{font-size:0.72rem; color:#8a7a5a; margin-bottom:0.7rem;}
  .dup-flag{
    display:inline-block; font-family:'Cinzel', serif; font-size:0.62rem; letter-spacing:0.05em;
    text-transform:uppercase; color:#e0a86b; background:rgba(139,90,30,0.18);
    border:1px solid #6b4a1f; border-radius:6px; padding:0.2rem 0.5rem; margin-bottom:0.6rem;
  }
  .card-actions{display:flex; gap:0.6rem;}
  .btn-aprobar, .btn-rechazar{
    flex:1; padding:0.65rem; border-radius:9px; font-size:0.68rem;
  }
  .btn-aprobar{background:linear-gradient(180deg,#ffe08a,#b8862f); border:1px solid #e8c15c; color:#1a1206; font-weight:700;}
  .btn-rechazar{background:rgba(139,58,58,0.12); border:1px solid #6b3a3a; color:#e0a0a0;}
  .btn-aprobar:active, .btn-rechazar:active{filter:brightness(0.9);}
  .btn-aprobar:disabled, .btn-rechazar:disabled{opacity:0.4; pointer-events:none;}
  .refresh-btn{
    display:block; margin:0 auto 1.3rem; padding:0.5rem 1.1rem;
    border:1px solid #4a3a1f; border-radius:20px; color:#a89876; font-size:0.62rem;
  }
  .toast{
    position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%);
    background:#1c150d; border:1px solid #55431f; border-radius:10px;
    padding:0.7rem 1.1rem; font-size:0.8rem; color:#f0e4c4;
    box-shadow:0 8px 24px rgba(0,0,0,0.5); opacity:0; transition:opacity 0.25s; pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

  <h1>Panel Apócrifo</h1>
  <div class="sub">Moderación de aportes pendientes</div>

  <div class="gate" id="gate">
    <label>Clave de administrador</label>
    <input type="password" id="claveInput" placeholder="••••••••" autocomplete="off" />
    <button class="btn-primary" id="entrarBtn">Entrar</button>
    <div class="gate-error" id="gateError">Clave incorrecta.</div>
  </div>

  <div id="app">
    <div class="stats-bar">
      <div><b id="statPendientes">—</b>pendientes</div>
      <div><b id="statDuplicados">—</b>posibles dup.</div>
    </div>
    <button class="refresh-btn" id="refreshBtn">↻ actualizar</button>
    <div id="lista"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const API_BASE = ''; // mismo origen que el worker

  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const claveInput = document.getElementById('claveInput');
  const entrarBtn = document.getElementById('entrarBtn');
  const gateError = document.getElementById('gateError');
  const lista = document.getElementById('lista');
  const toast = document.getElementById('toast');

  let ADMIN_KEY = sessionStorage.getItem('apocrifo_admin_key') || '';

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  async function intentarEntrar(){
    const clave = claveInput.value.trim();
    if(!clave) return;
    entrarBtn.textContent = 'Verificando...';
    const ok = await cargarPendientes(clave);
    entrarBtn.textContent = 'Entrar';
    if(ok){
      ADMIN_KEY = clave;
      sessionStorage.setItem('apocrifo_admin_key', clave);
      gate.style.display = 'none';
      app.style.display = 'block';
    } else {
      gateError.style.display = 'block';
    }
  }

  entrarBtn.addEventListener('click', intentarEntrar);
  claveInput.addEventListener('keydown', e => { if(e.key === 'Enter') intentarEntrar(); });

  async function cargarPendientes(claveTemporal){
    const clave = claveTemporal || ADMIN_KEY;
    try{
      const res = await fetch(`${API_BASE}/api/comunidad/pendientes`, {
        headers: { 'X-Admin-Key': clave }
      });
      if(res.status === 401){ return false; }
      const data = await res.json();
      renderLista(data.pendientes || []);
      return true;
    }catch(err){
      showToast('Error al cargar pendientes.');
      return false;
    }
  }

  function renderLista(pendientes){
    document.getElementById('statPendientes').textContent =
      pendientes.filter(p => p.estado === 'pendiente').length;
    document.getElementById('statDuplicados').textContent =
      pendientes.filter(p => p.estado === 'posible_duplicado').length;

    if(pendientes.length === 0){
      lista.innerHTML = '<div class="empty">No hay aportes esperando revisión. 🖤</div>';
      return;
    }

    lista.innerHTML = pendientes.map(p => {
      const fecha = p.fecha_creacion ? new Date(p.fecha_creacion).toLocaleDateString('es-AR') : '';
      const esDup = p.estado === 'posible_duplicado';
      return `
        <div class="card ${esDup ? 'dup' : ''}" data-id="${p.id}">
          ${esDup ? `<div class="dup-flag">⚠ posible duplicado de "${escapeHtml(p.duplicado_de_palabra || '?')}"</div>` : ''}
          <div class="card-top">
            <div class="card-palabra">${escapeHtml(p.palabra)}</div>
            <div class="card-fecha">${fecha}</div>
          </div>
          <div class="card-significado">${escapeHtml(p.significado)}</div>
          <div class="card-meta">por: ${escapeHtml(p.autor_id || 'anónimo')}</div>
          <div class="card-actions">
            <button class="btn-aprobar" onclick="moderar(${p.id}, 'aprobar', this)">Aprobar</button>
            <button class="btn-rechazar" onclick="moderar(${p.id}, 'rechazar', this)">Rechazar</button>
          </div>
        </div>`;
    }).join('');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  async function moderar(id, accion, btnEl){
    const card = btnEl.closest('.card');
    card.querySelectorAll('button').forEach(b => b.disabled = true);
    try{
      const res = await fetch(`${API_BASE}/api/comunidad/moderar`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': ADMIN_KEY },
        body: JSON.stringify({ id, accion })
      });
      const data = await res.json();
      if(data.ok){
        showToast(accion === 'aprobar' ? 'Aporte aprobado ✓' : 'Aporte rechazado');
        card.remove();
        cargarPendientes();
      } else {
        showToast('Error: ' + (data.error || 'no se pudo moderar'));
        card.querySelectorAll('button').forEach(b => b.disabled = false);
      }
    }catch(err){
      showToast('Error de conexión.');
      card.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', () => cargarPendientes());
  window.moderar = moderar;

  // si ya había una clave guardada en esta sesión, entrar directo
  if(ADMIN_KEY){
    cargarPendientes().then(ok => {
      if(ok){ gate.style.display = 'none'; app.style.display = 'block'; }
      else { sessionStorage.removeItem('apocrifo_admin_key'); }
    });
  }
</script>
</body>
</html>
