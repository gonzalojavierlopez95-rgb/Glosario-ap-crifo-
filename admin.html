<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Aprobación — Comunidad Apócrifa</title>
<style>
  body {
    font-family: 'Georgia', serif;
    background: #0d0d0d;
    color: #e8e0c8;
    padding: 20px;
    max-width: 700px;
    margin: 0 auto;
  }
  h1 { color: #c9a94f; font-size: 22px; }
  #login-box {
    background: #1a1a1a;
    padding: 20px;
    border: 1px solid #c9a94f;
    border-radius: 6px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin: 8px 0;
    background: #111;
    border: 1px solid #555;
    color: #e8e0c8;
    border-radius: 4px;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    margin-right: 8px;
  }
  #login-box button { background: #c9a94f; color: #111; width: 100%; }
  .aportar-card {
    background: #1a1a1a;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .aportar-card.duplicado {
    border: 2px solid #e0a23a;
    background: #221b0c;
  }
  .aviso-duplicado {
    background: #4a3a10;
    color: #ffd98a;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 13px;
    margin-bottom: 10px;
    font-weight: bold;
  }
  .aportar-card .palabra { color: #c9a94f; font-size: 18px; font-weight: bold; }
  .aportar-card .significado { margin: 6px 0; }
  .aportar-card .meta { font-size: 12px; color: #888; margin-bottom: 10px; }
  .btn-aprobar { background: #2f6b3a; color: white; }
  .btn-rechazar { background: #7a2b2b; color: white; }
  #lista { display: none; }
  #vacio { display: none; color: #888; }
</style>
</head>
<body>

<h1>🕯️ Panel de Aprobación — Comunidad Apócrifa</h1>

<div id="login-box">
  <p>Ingresá la clave de administrador:</p>
  <input type="password" id="clave" placeholder="Clave">
  <button onclick="entrar()">Entrar</button>
  <p id="login-error" style="color:#e07070; display:none;">Clave incorrecta o error de conexión.</p>
</div>

<div id="lista">
  <p id="contador"></p>
  <div id="items"></div>
</div>

<p id="vacio">No hay aportes pendientes por ahora.</p>

<script>
  let ADMIN_KEY = "";

  async function entrar() {
    ADMIN_KEY = document.getElementById('clave').value;
    const ok = await cargarPendientes();
    if (ok) {
      document.getElementById('login-box').style.display = 'none';
      sessionStorage.setItem('admin_key', ADMIN_KEY);
    }
  }

  async function cargarPendientes() {
    try {
      const res = await fetch('/api/comunidad/pendientes', {
        headers: { 'X-Admin-Key': ADMIN_KEY }
      });
      if (!res.ok) {
        document.getElementById('login-error').style.display = 'block';
        return false;
      }
      const data = await res.json();
      renderizar(data.pendientes);
      return true;
    } catch (err) {
      document.getElementById('login-error').style.display = 'block';
      return false;
    }
  }

  function renderizar(pendientes) {
    const lista = document.getElementById('lista');
    const vacio = document.getElementById('vacio');
    const items = document.getElementById('items');
    const contador = document.getElementById('contador');

    items.innerHTML = '';

    if (pendientes.length === 0) {
      lista.style.display = 'none';
      vacio.style.display = 'block';
      return;
    }

    vacio.style.display = 'none';
    lista.style.display = 'block';
    contador.textContent = pendientes.length + ' aporte(s) pendiente(s)';

    pendientes.forEach(p => {
      const esDuplicado = p.estado === 'posible_duplicado';
      const div = document.createElement('div');
      div.className = 'aportar-card' + (esDuplicado ? ' duplicado' : '');
      div.innerHTML = `
        ${esDuplicado ? `<div class="aviso-duplicado">⚠️ POSIBLE DUPLICADO de "${escapeHtml(p.duplicado_de_palabra || '')}" — revisar antes de aprobar</div>` : ''}
        <div class="palabra">${escapeHtml(p.palabra)}</div>
        <div class="significado">${escapeHtml(p.significado)}</div>
        <div class="meta">por ${escapeHtml(p.autor_id)} — ${new Date(p.fecha_creacion).toLocaleString('es-AR')}</div>
        <button class="btn-aprobar" onclick="moderar(${p.id}, 'aprobar')">✓ Aprobar</button>
        <button class="btn-rechazar" onclick="moderar(${p.id}, 'rechazar')">✗ Rechazar</button>
      `;
      items.appendChild(div);
    });
  }

  async function moderar(id, accion) {
    try {
      const res = await fetch('/api/comunidad/moderar', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Key': ADMIN_KEY
        },
        body: JSON.stringify({ id, accion })
      });
      if (res.ok) {
        cargarPendientes();
      } else {
        alert('Error al moderar el aporte.');
      }
    } catch (err) {
      alert('Error de conexión.');
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Si ya había una clave guardada en esta sesión, la reusamos
  window.onload = () => {
    const saved = sessionStorage.getItem('admin_key');
    if (saved) {
      document.getElementById('clave').value = saved;
      entrar();
    }
  };
</script>

</body>
</html>
